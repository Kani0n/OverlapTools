name: OverlapTools
channels:
  - conda-forge
  - bioconda
dependencies:
  # Python (OvlpTls.py and src/*.py)
  - python=3.13.11

  # score_ORFs (--score prodigal / balrog / pgap / bakta)
  - pyrodigal=3.7.1        # prodigal
  - pytorch=2.13           # balrog (gene and TIS models)
  - pyhmmer=0.12.3         # pgap (PGAP protein family HMMs)
  - bakta=1.12.1           # bakta (bakta_proteins)

  # find_homologs / align_codons
  - blast=2.17.0           # tblastn, blastdbcmd
  - taxonkit=0.20.0        # taxonomic context / filtering of tBLASTn hits
  - seqkit=2.13.0
  - muscle=5.3             # v5 syntax (-align/-output) is required
  - pal2nal=14.1

  # run_RNAcode
  - rnacode=0.3.1

  # run_OLGenie: src/OLGenie/OLGenie.pl (only core Perl modules)
  - perl=5.32.1

  # run_OLGenie: src/OLGenie/OLGenie_bootstrap.R
  - r-base=4.5
  - r-readr=2.2.0
  - r-stringr=1.6.0
  - r-boot=1.3_32
